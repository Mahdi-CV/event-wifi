[test]
name = "event-site-baseline"
controller_id = "LAPTOP-01"
concurrency = 5
iterations = 3
ramp_seconds = 30
request_timeout_seconds = 30
kernel_timeout_seconds = 60
execution_timeout_seconds = 120
pause_between_iterations_seconds = 10
results_root = "results"

[jupyter]
base_url = "https://jupyter.example.com"
# api_path_prefix = "/user/test-user"
token_env = "JUPYTER_TOKEN"
verify_tls = true
kernel_name = "python3"

[workload]
# Keep this representative, deterministic, and safe to run concurrently.
code = """
import json, math, os, platform, time
started = time.time()
values = [math.sqrt(i) for i in range(100000)]
payload = {
    "ok": len(values) == 100000,
    "hostname": platform.node(),
    "python": platform.python_version(),
    "elapsed_seconds": time.time() - started,
}
print("EVENT_WIFI_RESULT=" + json.dumps(payload, sort_keys=True))
"""

[acceptance]
wifi_success_percent = 98.0
jupyter_reachable_percent = 98.0
kernel_success_percent = 98.0
workload_success_percent = 98.0
max_disconnect_percent = 1.0
max_p95_total_seconds = 45.0

