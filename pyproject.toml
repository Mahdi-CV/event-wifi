[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-wifi-validator"
version = "0.1.0"
description = "Multi-adapter Wi-Fi and remote Jupyter capacity validation"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "websocket-client>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
event-wifi = "event_wifi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

